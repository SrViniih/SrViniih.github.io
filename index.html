<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taramundi - Bar & Restaurante</title>
    
    <!-- Fontes -->
     <!-- Biblioteca de Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Flatpickr CSS (Tema Dark) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

    <style>
        :root {
            --amarelo: #ffcc00; 
            --verde: #10b981;   
            --preto: #09090b;   
            --card-bg: #18181b; 
            --texto: #ffffff;
            --texto-secundario: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--preto);
            color: var(--texto);
            line-height: 1.6;
            padding-top: 100px; /* Evita que o hero suba para trás do header fixo */
        }

        /* --- HEADER & LOGO AMPLIADOS --- */
        header {
            background-color: rgba(9, 9, 11, 0.98);
            padding: 0 5%;
            position: fixed;
            top: 0;
            width: 100%;
            height: 100px;
            z-index: 1000;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            height: 100%;
            text-decoration: none;
        }

        .taramundi-img {
            height: 75px; 
            width: auto;
            object-fit: contain;
            transition: 0.3s;
        }

        .nav-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
            margin: 0 20px;
        }
        /* --- ESTILOS DO RODAPÉ --- */
footer {
    padding: 60px 20px 40px;
    text-align: center;
    border-top: 1px solid #27272a;
    background-color: #09090b;
    color: var(--texto-secundario);
}

.footer-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.footer-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
    color: var(--texto);
    text-decoration: none;
    transition: 0.3s;
}

.footer-item i {
    color: var(--verde); /* Ícones em Verde */
    font-size: 1.2rem;
}

.instagram-link:hover {
    color: var(--amarelo);
    transform: translateY(-2px);
}

.footer-divider {
    width: 100%;
    max-width: 300px;
    height: 1px;
    background: #27272a;
    margin: 10px 0;
}

.copyright {
    font-size: 0.8rem;
    color: #52525b;
}
        /* Custom Scrollbar Minimalista */
        nav { width: 100%; overflow-x: auto; white-space: nowrap; text-align: center; scrollbar-width: thin; scrollbar-color: #27272a transparent; }
        nav::-webkit-scrollbar { height: 4px; }
        nav::-webkit-scrollbar-track { background: transparent; }
        nav::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        nav:hover::-webkit-scrollbar-thumb { background: var(--verde); }
        
        nav ul { display: inline-flex; gap: 20px; list-style: none; padding: 0 10px; }
        nav a { 
            font-size: 0.90rem;
            text-transform: uppercase; 
            font-weight: 600;
            color: var(--verde); 
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        nav a:hover { color: var(--amarelo); text-shadow: 0 0 8px rgba(255, 204, 0, 0.4); }

        .btn-reserva-header {
            background-color: var(--amarelo);
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-reserva-header:hover { transform: scale(1.05); background-color: #e6b800; }

        /* --- HERO --- */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }
        .hero h2 { font-family: 'Playfair Display', serif; font-size: 4rem; color: var(--texto); margin-bottom: 10px; }
        .hero p { color: var(--texto-secundario); font-size: 1.1rem; margin-bottom: 30px; }
        .btn-hero { background-color: var(--amarelo); color: #000; padding: 15px 40px; border-radius: 30px; font-weight: bold; text-decoration: none; font-size: 1.1rem; transition: 0.3s; }
        .btn-hero:hover { transform: translateY(-3px); }

        /* --- CARROSSEL --- */
        .carousel-section { padding: 40px 5% 0 5%; max-width: 1300px; margin: auto; overflow: hidden; }
        .carousel-container { position: relative; width: 100%; border-radius: 20px; background: #111113; border: 1px solid #27272a; overflow: hidden; margin-top: 15px; }
        .carousel-track { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }

        .carousel-slide {
            min-width: 100%;
            display: flex;
            align-items: center;
            padding: 40px;
            gap: 40px;
        }

        .slide-img-box { width: 45%; height: 300px; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .slide-img-box img { width: 100%; height: 100%; object-fit: cover; }

        .slide-info-box { width: 55%; }
        .badge-promo { background: var(--amarelo); color: #000; padding: 5px 12px; border-radius: 5px; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 15px; display: inline-block; }
        .slide-info-box h2 { font-family: 'Playfair Display'; font-size: 2.5rem; color: #fff; margin-bottom: 15px; }
        .slide-info-box p { color: var(--texto-secundario); font-size: 1.1rem; margin-bottom: 25px; }
        .price-promo { color: var(--verde); font-size: 2.2rem; font-weight: bold; }

        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 10; font-size: 1.2rem; transition: 0.3s; }
        .carousel-btn:hover { background: var(--verde); }
        .prev { left: 20px; }
        .next { right: 20px; }

        .carousel-dots { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .dot { width: 10px; height: 10px; background: #333; border-radius: 50%; cursor: pointer; }
        .dot.active { background: var(--amarelo); width: 30px; border-radius: 10px; }

        /* --- MENU SECTION --- */
        .menu-section { padding: 40px 5%; max-width: 1300px; margin: auto; }
        .categoria-title {
            font-size: 2.2rem; 
            color: var(--amarelo); 
            margin: 40px 0 20px;
            border-left: 5px solid var(--verde); 
            padding-left: 15px;
            font-family: 'Playfair Display', serif;
        }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #27272a; transition: 0.3s; }
        .product-card:hover { border-color: var(--amarelo); transform: translateY(-5px); }

        .product-img-container { width: 100%; height: 200px; background: #1e1e21; border-radius: 10px; overflow: hidden; margin-bottom: 15px; border: 1px solid #27272a; }
        .no-photo { padding: 85px 0; text-align: center; color: #3f3f46; font-size: 0.8rem; }

        .product-info h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #fff; margin-bottom: 5px; }
        .product-info p { font-size: 0.85rem; color: var(--texto-secundario); margin-bottom: 15px; height: 40px; overflow: hidden; }
        .product-price { color: var(--amarelo); font-weight: bold; font-size: 1.2rem; }
        
        /* --- RESERVAS --- */
        .reserva-section { background-color: #111113; padding: 60px 20px; text-align: center; border-top: 1px solid #27272a; }
        .reserva-wrap { max-width: 450px; margin: auto; text-align: left; }
        input { width: 100%; padding: 15px; background: #27272a; border: 1px solid #3f3f46; border-radius: 8px; color: #fff; margin: 10px 0 20px; outline: none; }
        input:focus { border-color: var(--verde); }
        .btn-confirmar { width: 100%; background-color: var(--verde); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        footer { padding: 40px; text-align: center; border-top: 1px solid #27272a; color: var(--texto-secundario); font-size: 0.8rem; }

        /* Flatpickr Custom */
        .flatpickr-calendar { background: #18181b !important; border: 1px solid #27272a !important; }
        .flatpickr-time input:hover { background: var(--verde) !important; }
        .flatpickr-day.selected { background: var(--amarelo) !important; color: #000 !important; border: none; }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            header { height: auto; padding: 10px 2%; flex-wrap: wrap; justify-content: space-between; }
            .taramundi-img { height: 50px; }
            
            .nav-container { 
                order: 3; width: 100%; margin: 8px 0 0 0; border-top: 1px solid #1a1a1c; 
                padding-top: 8px; overflow-x: auto; display: block; -webkit-overflow-scrolling: touch; 
            }
            nav ul { gap: 20px; display: flex; flex-wrap: nowrap; padding: 0 15px 5px 15px; }
            nav a { font-size: 0.85rem; white-space: nowrap; }

            .hero h2 { font-size: 2.5rem; }
            .btn-reserva-header { padding: 8px 12px; font-size: 0.7rem; }
            body { padding-top: 135px; } 

            /* Ajustes Mobile Carrossel */
            .carousel-slide { flex-direction: column; padding: 20px; gap: 20px; text-align: center; }
            .slide-img-box { width: 100%; height: 200px; }
            .slide-info-box { width: 100%; }
            .slide-info-box h2 { font-size: 1.8rem; }
            .carousel-btn { display: none; }
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="brand">
        <img src="img/taramundi.webp" alt="Taramundi Logo" class="taramundi-img">
    </a>
    
    <div class="nav-container">
        <nav>
            <ul id="nav-list"></ul>
        </nav>
    </div>
    
    <a href="#reserva" class="btn-reserva-header">Reserva tu Mesa</a>
</header>

<section class="hero">
    <h2>Taramundi</h2>
    <p>Tradición y Sabor Auténtico. Explore nuestra cocina.</p>
    <a href="#reserva" class="btn-hero">Reserva tu Mesa</a>
</section>

<!-- CARROSSEL 1: RECOMENDADOS -->
<section class="carousel-section" id="recomendados-section">
    <h2 class="categoria-title" style="margin-top: 0;">Recomendados</h2>
    <div class="carousel-container" id="carousel-rec">
        <div class="carousel-track" id="track-rec"></div>
        <button class="carousel-btn prev" onclick="moveSlide('rec', -1)">&#10094;</button>
        <button class="carousel-btn next" onclick="moveSlide('rec', 1)">&#10095;</button>
        <div class="carousel-dots" id="dots-rec"></div>
    </div>
</section>

<!-- CARROSSEL 2: PRATOS NOVOS -->
<section class="carousel-section" id="novos-section">
    <h2 class="categoria-title" style="margin-top: 0;">Pratos Novos</h2>
    <div class="carousel-container" id="carousel-novos">
        <div class="carousel-track" id="track-novos"></div>
        <button class="carousel-btn prev" onclick="moveSlide('novos', -1)">&#10094;</button>
        <button class="carousel-btn next" onclick="moveSlide('novos', 1)">&#10095;</button>
        <div class="carousel-dots" id="dots-novos"></div>
    </div>
</section>

<!-- MENU COMPLETO -->
<main class="menu-section" id="menu-container"></main>

<section id="reserva" class="reserva-section">
    <div class="reserva-wrap">
        <h2 style="font-family: 'Playfair Display'; font-size: 2rem; color: #fff; text-align: center; margin-bottom: 30px;">Hacer una Reserva</h2>
        <form id="form-reserva">
            <label>Fecha</label>
            <input type="text" id="data" placeholder="Selecciona fecha" required>
            <label>Hora</label>
            <input type="text" id="hora" placeholder="Selecciona hora" required>
            <button type="submit" class="btn-confirmar">Confirmar por WhatsApp</button>
        </form>
    </div>
</section>

<footer>
    <div class="footer-container">
        <!-- Localização -->
        <div class="footer-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>C. Embajadores, 14, 47013 Valladolid</span>
        </div>

        <!-- Instagram -->
        <a href="https://www.instagram.com/taramundi16" target="_blank" class="footer-item instagram-link">
            <i class="fab fa-instagram"></i>
            <span>@taramundi16</span>
        </a>

        <div class="footer-divider"></div>

        <p class="copyright">&copy; 2026 Taramundi Bar & Restaurante.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="dados.js"></script>

<script>
    const menuContainer = document.getElementById('menu-container');
    const navList = document.getElementById('nav-list');

    /* =========================================
       MOTOR DO CARROSSEL (DESTAQUES E NOVOS)
       ========================================= */
    const carouselStates = {
        rec: { current: 0, data: recomendados, folder: 'destaques' },
        novos: { current: 0, data: pratosNovos, folder: 'novos' }
    };

    function initCarousels() {
        for (const [id, state] of Object.entries(carouselStates)) {
            const track = document.getElementById(`track-${id}`);
            const dotsCont = document.getElementById(`dots-${id}`);
            
            state.data.forEach((item, i) => {
                const [nome, desc, preco] = item.split('|').map(s => s.trim());
                // IMPORTANTE: Aqui ele vai procurar a imagem "destaque-1.webp" ou "novos-1.webp"
                const fotoUrl = `img/${state.folder}/${state.folder}-${i+1}.webp`;

                track.innerHTML += `
                    <div class="carousel-slide">
                        <div class="slide-img-box">
                            <!-- Se não achar a foto, exibe a imagem padrão 'no-photo' -->
                            <img src="${fotoUrl}" onerror="this.src='https://via.placeholder.com/600x400?text=Foto+en+camino...'">
                        </div>
                        <div class="slide-info-box">
                            <span class="badge-promo">${id === 'rec' ? '⭐ Favorito' : '🔥 ¡NUEVO!'}</span>
                            <h2>${nome}</h2>
                            <p>${desc}</p>
                            <div class="price-promo">${preco}</div>
                        </div>
                    </div>`;
                dotsCont.innerHTML += `<div class="dot ${i===0?'active':''}" onclick="jumpTo('${id}', ${i})"></div>`;
            });
        }
    }

    function moveSlide(id, dir) {
        const state = carouselStates[id];
        const total = state.data.length;
        state.current = (state.current + dir + total) % total;
        updateCarouselUI(id);
    }

    function jumpTo(id, i) {
        carouselStates[id].current = i;
        updateCarouselUI(id);
    }

    function updateCarouselUI(id) {
        const track = document.getElementById(`track-${id}`);
        track.style.transform = `translateX(-${carouselStates[id].current * 100}%)`;
        const dots = document.querySelectorAll(`#dots-${id} .dot`);
        dots.forEach((d, i) => d.classList.toggle('active', i === carouselStates[id].current));
    }

    initCarousels();
    setInterval(() => moveSlide('rec', 1), 7000);
    setInterval(() => moveSlide('novos', 1), 5000);


    /* =========================================
       MOTOR DO CARDÁPIO PRINCIPAL
       ========================================= */
    categorias.forEach(cat => {
        navList.innerHTML += `<li><a href="#${cat.id}">${cat.nome}</a></li>`;
        
        let section = document.createElement('section');
        section.id = cat.id;
        
        let html = `<h2 class="categoria-title">${cat.nome}</h2><div class="product-grid">`;

        cat.itens.forEach((itemString, index) => {
            const partes = itemString.split('|').map(p => p.trim());
            const nome = partes[0];
            const descricao = partes[1];
            const preco = partes[2]; 
            
            let numeroFoto = index + 1; 
            let nomeFoto = `${cat.id}-${numeroFoto}.webp`; 
            let caminhoFoto = `img/${cat.id}/${nomeFoto}`; 

            html += `
                <div class="product-card">
                    <div class="product-img-container">
                        <img src="${caminhoFoto}" alt="${nome}" 
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'no-photo\'>Foto en camino...</div>'"
                             style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div class="product-info">
                        <h3>${nome}</h3>
                        <p>${descricao || 'Preparado con ingredientes frescos.'}</p>
                        <span class="product-price">${preco || 'Consultar'}</span>
                    </div>
                </div>`;
        });

        html += `</div>`;
        section.innerHTML = html;
        menuContainer.appendChild(section);
    });

    /* =========================================
       WHATSAPP & FLATPICKR (RESERVAS)
       ========================================= */
    document.getElementById('form-reserva').addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = `Hola, ¿la reserva para el día ${document.getElementById('data').value} a las ${document.getElementById('hora').value} está disponible?`;
        window.open(`https://wa.me/34652221002?text=${encodeURIComponent(msg)}`, '_blank');
    });

    flatpickr("#data", { dateFormat: "d/m/Y", minDate: "today" });
    flatpickr("#hora", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });
</script>
</body>
</html>

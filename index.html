<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taramundi - Bar & Restaurante</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --amarelo: #ffcc00; 
            --verde: #10b981;   /* Verde Taramundi */
            --preto: #09090b;   
            --card-bg: #18181b; 
            --texto: #ffffff;
            --texto-secundario: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--preto);
            color: var(--texto);
            line-height: 1.6;
        }

        /* --- HEADER & NAV --- */
        header {
            background-color: rgba(9, 9, 11, 0.95);
            padding: 10px 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #27272a;
        }

        .header-wrap { display: flex; flex-direction: column; align-items: center; }
        .brand { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--verde); font-style: italic; }

        nav { width: 100%; overflow-x: auto; white-space: nowrap; padding: 10px 0; }
        nav::-webkit-scrollbar { display: none; } /* Esconde barra de scroll */

        nav ul { display: inline-flex; gap: 20px; padding: 0 20px; }
        nav a { font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--texto-secundario); transition: 0.3s; }
        nav a:hover { color: var(--amarelo); }

        /* --- HERO --- */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
            display: flex; align-items: center; justify-content: center; text-align: center; margin-top: 100px;
        }
        .hero h2 { font-size: 3.5rem; color: var(--verde); }

        /* --- MENU SECTION --- */
        .menu-section { padding: 60px 0; }
        .categoria-title {
            font-size: 2rem; color: var(--amarelo); margin: 40px 0 20px;
            border-left: 4px solid var(--verde); padding-left: 15px;
            font-family: 'Playfair Display', serif;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg); border-radius: 12px;
            padding: 15px; border: 1px solid #27272a; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--verde); transform: translateY(-3px); }

        .product-info h3 { font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
        .product-info p { font-size: 0.85rem; color: var(--texto-secundario); height: 40px; overflow: hidden; }
        .product-price { color: var(--amarelo); font-weight: bold; font-size: 1.2rem; display: block; margin-top: 10px; }

        /* --- RESERVAS --- */
        .reserva-section { background-color: #111113; padding: 80px 20px; text-align: center; }
        .reserva-wrap { max-width: 500px; margin: auto; text-align: left; }
        .form-group { margin-bottom: 15px; }
        input, select {
            width: 100%; padding: 12px; background: #27272a; border: 1px solid #3f3f46;
            border-radius: 8px; color: #fff; margin-top: 5px;
        }
        .btn-confirmar {
            width: 100%; background-color: var(--verde); color: white; padding: 15px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px;
        }

        footer { padding: 40px; text-align: center; border-top: 1px solid #27272a; font-size: 0.8rem; color: var(--texto-secundario); }

        @media (max-width: 768px) { .hero h2 { font-size: 2.5rem; } }
    </style>
</head>
<body>

<header>
    <div class="container header-wrap">
        <span class="brand">Taramundi</span>
        <nav>
            <ul>
                <li><a href="#desayunos">Desayunos</a></li>
                <li><a href="#tablas">Tablas</a></li>
                <li><a href="#platos">Platos</a></li>
                <li><a href="#sartenes">Sartenes</a></li>
                <li><a href="#hamburguesas">Burgers</a></li>
                <li><a href="#raciones">Raciones</a></li>
                <li><a href="#bocatas">Bocatas</a></li>
                <li><a href="#sandwich">Sandwich</a></li>
                <li><a href="#ensaladas">Ensaladas</a></li>
                <li><a href="#postres">Postres</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <h2>Tradición Gallega</h2>
        <p>Menú Digital & Reservas</p>
    </div>
</section>

<section class="menu-section container" style="max-width: 1200px; margin: auto; padding: 20px;">
    <!-- As categorias serão geradas pelo JavaScript -->
    <div id="conteudo-menu"></div>
</section>

<section id="reserva" class="reserva-section">
    <div class="reserva-wrap">
        <h2 style="font-family: 'Playfair Display'; font-size: 2rem; margin-bottom: 20px;">Reserva tu Mesa</h2>
        <form id="form-reserva">
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-group">
                <label>Hora</label>
                <input type="time" id="hora" required>
            </div>
            <button type="submit" class="btn-confirmar">
                Consultar disponibilidad por WhatsApp
            </button>
        </form>
    </div>
</section>

<footer>
    <p>&copy; 2026 Taramundi Bar & Restaurante. Todos los derechos reservados.</p>
</footer>

<script>
    // --- BANCO DE DADOS ATUALIZADO (64 ITENS TOTAL) ---
    const categorias = [
        { id: 'desayunos', titulo: 'Desayunos', qtd: 16 },
        { id: 'tablas', titulo: 'Tablas Completas', qtd: 3 },
        { id: 'platos', titulo: 'Platos Combinados', qtd: 4 },
        { id: 'sartenes', titulo: 'Sartenes Taramundi', qtd: 7 },
        { id: 'hamburguesas', titulo: 'Hamburguesas', qtd: 9 },
        { id: 'raciones', titulo: 'Raciones', qtd: 8 },
        { id: 'bocatas', titulo: 'Bocatas', qtd: 7 },
        { id: 'sandwich', titulo: 'Sandwich y Perritos', qtd: 5 },
        { id: 'ensaladas', titulo: 'Ensaladas de la Casa', qtd: 3 },
        { id: 'postres', titulo: 'Postres', qtd: 2 }
    ];

    const menuConteudo = document.getElementById('conteudo-menu');

    // Gera os produtos automaticamente para o seu template
    categorias.forEach(cat => {
        // Criar o título da categoria
        let html = `<div id="${cat.id}"><h2 class="categoria-title">${cat.titulo}</h2><div class="product-grid">`;
        
        // Criar os produtos da categoria
        for (let i = 1; i <= cat.qtd; i++) {
            html += `
                <div class="product-card">
                    <div class="product-info">
                        <h3>${cat.titulo} #${i}</h3>
                        <p>Descripción premium del producto seleccionado para el menú.</p>
                        <span class="product-price">12,50€</span>
                    </div>
                </div>
            `;
        }
        
        html += `</div></div>`;
        menuConteudo.innerHTML += html;
    });

    // --- SISTEMA DE RESERVA VIA WHATSAPP ---
    document.getElementById('form-reserva').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const data = document.getElementById('data').value;
        const hora = document.getElementById('hora').value;
        const telefoneWhats = "34600000000"; // Substitua pelo número real da Espanha

        // Mensagem conforme solicitado
        const mensagem = encodeURIComponent(`Hola, ¿la reserva para la fecha ${data} a las ${hora} está disponible?`);

        window.open(`https://wa.me/${telefoneWhats}?text=${mensagem}`, '_blank');
    });
</script>

</body>
</html>

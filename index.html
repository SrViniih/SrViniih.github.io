<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taramundi - Bar & Restaurante</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --amarelo: #ffcc00; 
            --verde: #10b981;   
            --preto: #09090b;   
            --card-bg: #18181b; 
            --texto: #ffffff;
            --texto-secundario: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--preto);
            color: var(--texto);
            line-height: 1.6;
        }

        /* --- HEADER & NAV --- */
        header {
            background-color: rgba(9, 9, 11, 0.98);
            padding: 15px 5%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { 
            font-family: 'Playfair Display', serif; 
            font-size: 1.8rem; 
            color: var(--verde); 
            font-weight: bold;
            text-decoration: none;
        }

        .nav-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        nav { width: 100%; overflow-x: auto; white-space: nowrap; text-align: center; }
        nav::-webkit-scrollbar { display: none; }

        nav ul { display: inline-flex; gap: 20px; list-style: none; padding: 0 20px; }
        nav a { 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            font-weight: 700; 
            color: var(--verde); 
            text-decoration: none;
            transition: 0.3s;
        }
        nav a:hover { color: var(--amarelo); }

        .btn-reserva-header {
            background-color: var(--amarelo);
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-reserva-header:hover { transform: scale(1.05); background-color: #e6b800; }

        /* --- HERO --- */
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            margin-top: 60px;
        }
        .hero h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 5rem; 
            color: var(--texto); 
            margin-bottom: 10px;
        }
        .hero p { color: var(--texto-secundario); font-size: 1.1rem; margin-bottom: 30px; }

        .btn-hero {
            background-color: var(--amarelo);
            color: #000;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5); }

        /* --- MENU SECTION --- */
        .menu-section { padding: 60px 5%; max-width: 1300px; margin: auto; }
        .categoria-title {
            font-size: 2.2rem; 
            color: var(--amarelo); 
            margin: 50px 0 25px;
            border-left: 5px solid var(--verde); 
            padding-left: 15px;
            font-family: 'Playfair Display', serif;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg); 
            border-radius: 12px;
            padding: 20px; 
            border: 1px solid #27272a; 
            transition: 0.3s;
        }
        .product-card:hover { border-color: var(--amarelo); }

        .product-info h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #fff; margin-bottom: 5px; }
        .product-info p { font-size: 0.85rem; color: var(--texto-secundario); margin-bottom: 15px; }
        .product-price { color: var(--amarelo); font-weight: bold; font-size: 1.2rem; }

        /* --- RESERVAS FORM --- */
        .reserva-section { background-color: #111113; padding: 80px 20px; text-align: center; border-top: 1px solid #27272a; }
        .reserva-wrap { max-width: 500px; margin: auto; text-align: left; }
        
        input {
            width: 100%; padding: 15px; background: #27272a; border: 1px solid #3f3f46;
            border-radius: 8px; color: #fff; margin: 10px 0 20px;
        }
        
        .btn-confirmar {
            width: 100%; background-color: var(--verde); color: white; padding: 15px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        footer { padding: 40px; text-align: center; border-top: 1px solid #27272a; color: var(--texto-secundario); font-size: 0.8rem; }

        @media (max-width: 768px) {
            header { padding: 10px 2%; }
            .hero h2 { font-size: 3rem; }
            .nav-container { display: none; } /* Oculta menu longo no mobile para focar no botão */
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="brand">Taramundi</a>
    <div class="nav-container">
        <nav>
            <ul id="nav-list"></ul>
        </nav>
    </div>
    <a href="#reserva" class="btn-reserva-header">Reserva tu Mesa</a>
</header>

<section class="hero">
    <h2>Taramundi</h2>
    <p>Tradición y Sabor Auténtico. Explore nuestra cocina.</p>
    <a href="#reserva" class="btn-hero">Reserva tu Mesa</a>
</section>

<main class="menu-section" id="menu-container"></main>

<section id="reserva" class="reserva-section">
    <div class="reserva-wrap">
        <h2 style="font-family: 'Playfair Display'; font-size: 2.5rem; color: #fff; text-align: center; margin-bottom: 30px;">Hacer una Reserva</h2>
        <form id="form-reserva">
            <label>Fecha</label>
            <input type="date" id="data" required>
            <label>Hora</label>
            <input type="time" id="hora" required>
            <button type="submit" class="btn-confirmar">Confirmar por WhatsApp</button>
        </form>
    </div>
</section>

<footer><p>&copy; 2026 Taramundi Bar & Restaurante.</p></footer>

<!-- Primeiro carregamos os DADOS -->
<script src="dados.js"></script>

<!-- Depois carregamos a LÓGICA que usa esses dados -->
<script>
    const menuContainer = document.getElementById('menu-container');
    const navList = document.getElementById('nav-list');

    // A mágica acontece aqui:
    categorias.forEach(cat => {
        // Cria o link no menu superior
        navList.innerHTML += `<li><a href="#${cat.id}">${cat.nome}</a></li>`;

        // Cria a seção da categoria
        let section = document.createElement('section');
        section.id = cat.id;
        
        let html = `<h2 class="categoria-title">${cat.nome}</h2><div class="product-grid">`;
        
        // Loop pelos itens que você listou no dados.js
        cat.itens.forEach((nomeDoPrato, index) => {
            let numeroFoto = index + 1; 
            let nomeFoto = `${cat.id}-${numeroFoto}.webp`; 
            let caminhoFoto = `img/${nomeFoto}`; 

            html += `
                <div class="product-card">
                    <div style="width:100%; height:220px; background:#1e1e21; border-radius:10px; overflow:hidden; margin-bottom:15px; border: 1px solid #27272a;">
                        <img src="${caminhoFoto}" 
                             alt="${nomeDoPrato}" 
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=&quot;padding:90px 0; text-align:center; color:#3f3f46; font-size:0.8rem;&quot;>Foto en camino...</div>'"
                             style="width:100%; height:100%; object-fit:cover; transition: 0.5s;">
                    </div>
                    <div class="product-info">
                        <h3>${nomeDoPrato}</h3>
                        <p>Descripción especial con los mejores ingredientes de la región.</p>
                        <span class="product-price">12,90€</span>
                    </div>
                </div>`;
        });
        
        html += `</div>`;
        section.innerHTML = html;
        menuContainer.appendChild(section);
    });

    // Lógica do WhatsApp (Mantenha igual)
    document.getElementById('form-reserva').addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = `Hola, ¿la reserva para el día ${document.getElementById('data').value} a las ${document.getElementById('hora').value} está disponible?`;
        window.open(`https://wa.me/34643496470?text=${encodeURIComponent(msg)}`, '_blank');
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taramundi - Bar & Restaurante</title>
    
    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Flatpickr CSS (Tema Dark) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

    <style>
        :root {
            --amarelo: #ffcc00; 
            --verde: #10b981;   
            --preto: #09090b;   
            --card-bg: #18181b; 
            --texto: #ffffff;
            --texto-secundario: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--preto);
            color: var(--texto);
            line-height: 1.6;
            padding-top: 80px; /* Evita que o hero suba para trás do header fixo */
        }

        /* --- HEADER & LOGO --- */
       /* --- HEADER & LOGO AMPLIADOS --- */
header {
    background-color: rgba(9, 9, 11, 0.98);
    padding: 0 5%;
    position: fixed;
    top: 0;
    width: 100%;
    height: 100px; /* Aumentamos de 80px para 100px para dar mais espaço */
    z-index: 1000;
    border-bottom: 1px solid #27272a;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    height: 100%;
}

.taramundi-img {
    height: 100px; /* Aumentamos de 55px para 75px para ficar bem imponente */
    width: auto;
    object-fit: contain;
    transition: 0.3s;
}

body {
    padding-top: 100px; /* Ajuste o padding do body para a mesma altura do header */
}

/* Ajuste Mobile para a logo não sumir */
@media (max-width: 768px) {
    header { 
        height: auto; 
        padding: 15px 2%; 
    }
    .taramundi-img { 
        height: 80px; /* No celular ela também fica maior agora */
    }
    body { 
        padding-top: 170px; /* Espaço maior no mobile por causa do menu que quebra linha */
    }
}

        /* Custom Scrollbar Minimalista */
        nav::-webkit-scrollbar { height: 4px; }
        nav::-webkit-scrollbar-track { background: transparent; }
        nav::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        nav:hover::-webkit-scrollbar-thumb { background: var(--verde); }
        nav { scrollbar-width: thin; scrollbar-color: #27272a transparent; }

        nav ul { display: inline-flex; gap: 20px; list-style: none; padding: 0 10px; }
        nav a { 
    font-size: 0.80rem;          /* Aumentamos de 0.7 para 0.9 para maior nitidez */
    text-transform: uppercase; 
    font-weight: 600;           /* Um peso 600 fica mais limpo que o 700 para leitura */
    color: var(--verde); 
    text-decoration: none;
    letter-spacing: 1px;        /* Espaçamento entre letras ajuda na leitura rápida */
    transition: 0.3s;
}

/* Efeito para quando o mouse passa por cima */
nav a:hover { 
    color: var(--amarelo); 
    text-shadow: 0 0 8px rgba(255, 204, 0, 0.4); /* Leve brilho ao focar */
}

        .btn-reserva-header {
            background-color: var(--amarelo);
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
            white-space: nowrap;
        }
        .btn-reserva-header:hover { transform: scale(1.05); background-color: #e6b800; }

        /* --- HERO --- */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }
        .hero h2 { 
            font-family: 'Playfair Display', serif;
            font-size: 4rem; 
            color: var(--texto); 
            margin-bottom: 10px;
        }
        .hero p { color: var(--texto-secundario); font-size: 1.1rem; margin-bottom: 30px; }

        /* --- MENU SECTION --- */
        .menu-section { padding: 40px 5%; max-width: 1300px; margin: auto; }
        .categoria-title {
            font-size: 2.2rem; 
            color: var(--amarelo); 
            margin: 40px 0 20px;
            border-left: 5px solid var(--verde); 
            padding-left: 15px;
            font-family: 'Playfair Display', serif;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg); 
            border-radius: 12px;
            padding: 20px; 
            border: 1px solid #27272a; 
            transition: 0.3s;
        }
        .product-card:hover { border-color: var(--amarelo); transform: translateY(-5px); }

        .product-img-container {
            width: 100%;
            height: 200px;
            background: #1e1e21;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #27272a;
        }

        .no-photo {
            padding: 85px 0;
            text-align: center;
            color: #3f3f46;
            font-size: 0.8rem;
        }

        .product-info h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #fff; margin-bottom: 5px; }
        .product-info p { font-size: 0.85rem; color: var(--texto-secundario); margin-bottom: 15px; height: 40px; overflow: hidden; }
        .product-price { color: var(--amarelo); font-weight: bold; font-size: 1.2rem; }
        
        /* --- RESERVAS --- */
        .reserva-section { background-color: #111113; padding: 60px 20px; text-align: center; border-top: 1px solid #27272a; }
        .reserva-wrap { max-width: 450px; margin: auto; text-align: left; }
        input {
            width: 100%; padding: 15px; background: #27272a; border: 1px solid #3f3f46;
            border-radius: 8px; color: #fff; margin: 10px 0 20px; outline: none;
        }
        input:focus { border-color: var(--verde); }
        .btn-confirmar {
            width: 100%; background-color: var(--verde); color: white; padding: 15px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
        }

        footer { padding: 40px; text-align: center; border-top: 1px solid #27272a; color: var(--texto-secundario); font-size: 0.8rem; }

        /* Flatpickr Custom */
        .flatpickr-calendar { background: #18181b !important; border: 1px solid #27272a !important; box-shadow: 0 10px 15px rgba(0,0,0,0.5) !important; }
        .flatpickr-time input:hover { background: var(--verde) !important; }
        .flatpickr-day.selected { background: var(--amarelo) !important; color: #000 !important; border: none; }

        /* --- MOBILE --- */
        /* --- AJUSTE PARA CELULAR (CORRIGIDO) --- */
@media (max-width: 768px) {
    header { 
        height: auto; 
        padding: 10px 2%; 
        flex-wrap: wrap; 
        justify-content: space-between; 
    }

    .taramundi-img { 
        height: 45px; /* Ajuste leve para a logo não ocupar espaço demais */
    }

    .nav-container { 
        order: 3; 
        width: 100%; 
        margin-top: 8px; 
        /* Deixando a barra de separação mais discreta (cinza bem escuro) */
        border-top: 1px solid #1a1a1c; 
        padding-top: 8px; 
        overflow-x: auto; /* Permite o deslize horizontal */
        display: block;
        -webkit-overflow-scrolling: touch; /* Scroll suave para iPhone */
    }

    nav ul { 
        gap: 20px; 
        display: flex; 
        flex-wrap: nowrap; /* IMPEDE que as categorias quebrem linha */
        padding: 0 15px 5px 15px; /* Espaço nas laterais para o texto não colar na borda */
    }

    nav a { 
        font-size: 0.85rem; 
        white-space: nowrap; /* FORÇA o texto a ficar em uma linha só (ex: Tablas Completas) */
        font-weight: 600;
    }

    .hero h2 { font-size: 2.5rem; }
    .btn-reserva-header { padding: 8px 12px; font-size: 0.7rem; }
    
    /* Ajuste do topo para o conteúdo não começar debaixo do header */
    body { padding-top: 135px; } 
}
/* --- ESTILOS DO CARROSSEL --- */
.carousel-section { padding: 40px 5%; max-width: 1300px; margin: auto; overflow: hidden; }

.carousel-container { position: relative; width: 100%; margin-top: 20px; }

.carousel-track { 
    display: flex; 
    transition: transform 0.5s ease-in-out; 
    gap: 20px;
}

.carousel-slide {
    min-width: 100%; /* Mostra 1 por vez no mobile */
    background: var(--card-bg);
    border-radius: 15px;
    border: 1px solid #27272a;
    display: flex;
    align-items: center;
    padding: 20px;
    gap: 30px;
}

/* No PC, o slide fica mais bonito com a imagem ao lado do texto */
.slide-img { 
    width: 40%; 
    height: 300px; 
    border-radius: 10px; 
    object-fit: cover; 
}

.slide-info { width: 60%; }
.slide-info h3 { font-family: 'Playfair Display'; font-size: 2rem; color: var(--amarelo); margin-bottom: 10px; }
.slide-info p { color: var(--texto-secundario); margin-bottom: 20px; }
.badge-novo { background: var(--verde); color: #000; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.7rem; text-transform: uppercase; }

/* Botões */
.carousel-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.5); color: white; border: none; padding: 15px;
    cursor: pointer; border-radius: 50%; z-index: 10; transition: 0.3s;
}
.carousel-btn:hover { background: var(--verde); }
.prev { left: -20px; }
.next { right: -20px; }

.carousel-dots { text-align: center; margin-top: 20px; }
.dot { height: 10px; width: 10px; margin: 0 5px; background-color: #333; border-radius: 50%; display: inline-block; cursor: pointer; }
.dot.active { background-color: var(--verde); width: 25px; border-radius: 10px; }

/* Ajuste Mobile */
@media (max-width: 768px) {
    .carousel-slide { flex-direction: column; text-align: center; padding: 15px; }
    .slide-img { width: 100%; height: 200px; }
    .slide-info { width: 100%; }
    .carousel-btn { display: none; } /* Esconde setas no mobile para usar o dedo */
}
    </style>
</head>
<body>

<header>
    <a href="#" class="brand">
        <img src="img/taramundi.webp" alt="Taramundi Logo" class="taramundi-img">
    </a>
    
    <div class="nav-container">
        <nav>
            <ul id="nav-list"></ul>
        </nav>
    </div>
    
    <a href="#reserva" class="btn-reserva-header">Reserva tu Mesa</a>
</header>

<!-- SEÇÃO DE DESTAQUES (CARROSSEL) -->
<section class="carousel-section">
    <h2 class="categoria-title" style="margin-top: 0;">Recomendados</h2>
    <div class="carousel-container">
        <div class="carousel-track" id="carousel-track">
            <!-- Os slides serão gerados pelo JavaScript -->
        </div>
        
        <!-- Botões de Navegação -->
        <button class="carousel-btn prev" onclick="moveCarousel(-1)">&#10094;</button>
        <button class="carousel-btn next" onclick="moveCarousel(1)">&#10095;</button>
        
        <!-- Indicadores (Pontinhos) -->
        <div class="carousel-dots" id="carousel-dots"></div>
    </div>
</section>

<main class="menu-section" id="menu-container"></main>

<section id="reserva" class="reserva-section">
    <div class="reserva-wrap">
        <h2 style="font-family: 'Playfair Display'; font-size: 2rem; color: #fff; text-align: center; margin-bottom: 30px;">Hacer una Reserva</h2>
        <form id="form-reserva">
            <label>Fecha</label>
            <input type="text" id="data" placeholder="Selecciona fecha" required>
            <label>Hora</label>
            <input type="text" id="hora" placeholder="Selecciona hora" required>
            <button type="submit" class="btn-confirmar">Confirmar por WhatsApp</button>
        </form>
    </div>
</section>

<footer><p>&copy; 2026 Taramundi Bar & Restaurante.</p></footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="dados.js"></script>

<script>
    const menuContainer = document.getElementById('menu-container');
    const navList = document.getElementById('nav-list');

    // Motor de Geração do Cardápio
    categorias.forEach(cat => {
        // Menu superior
        navList.innerHTML += `<li><a href="#${cat.id}">${cat.nome}</a></li>`;
        
        // Seção da categoria
        let section = document.createElement('section');
        section.id = cat.id;
        
        let html = `<h2 class="categoria-title">${cat.nome}</h2><div class="product-grid">`;

        cat.itens.forEach((itemString, index) => {
            const partes = itemString.split('|').map(p => p.trim());
            const nome = partes[0];
            const descricao = partes[1];
            const preco = partes[2]; 
            
            let numeroFoto = index + 1; 
            let nomeFoto = `${cat.id}-${numeroFoto}.webp`; 
            let caminhoFoto = `img/${cat.id}/${nomeFoto}`; 

            html += `
                <div class="product-card">
                    <div class="product-img-container">
                        <img src="${caminhoFoto}" 
                             alt="${nome}" 
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'no-photo\'>Foto en camino...</div>'"
                             style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div class="product-info">
                        <h3>${nome}</h3>
                        <p>${descricao || 'Preparado con ingredientes de alta calidad.'}</p>
                        <span class="product-price">${preco || 'Consultar'}</span>
                    </div>
                </div>`;
        });

        html += `</div>`;
        section.innerHTML = html;
        menuContainer.appendChild(section);
    });

    // Envio WhatsApp
    document.getElementById('form-reserva').addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = `Hola, ¿la reserva para el día ${document.getElementById('data').value} a las ${document.getElementById('hora').value} está disponible?`;
        window.open(`https://wa.me/34643496470?text=${encodeURIComponent(msg)}`, '_blank');
    });

    // Ativação Flatpickr
    flatpickr("#data", { dateFormat: "d/m/Y", minDate: "today" });
    flatpickr("#hora", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });
    // 1. Defina quais produtos quer destacar aqui (ID da categoria, índice do item no dados.js)
const destaques = [
    { cat: 'tablas', index: 1, label: 'Recomendado' },
    { cat: 'hamburguesas', index: 8, label: 'Novo!' },
    { cat: 'postres', index: 0, label: 'Destaque' }
];

const track = document.getElementById('carousel-track');
const dotsContainer = document.getElementById('carousel-dots');
let currentIndex = 0;

// 2. Gera os slides automaticamente pegando os dados do seu dados.js
destaques.forEach((d, i) => {
    const categoria = categorias.find(c => c.id === d.cat);
    const itemData = categoria.itens[d.index].split('|').map(p => p.trim());
    
    // HTML do Slide
    track.innerHTML += `
        <div class="carousel-slide">
            <img src="img/${d.cat}/${d.cat}-${d.index + 1}.webp" class="slide-img" onerror="this.src='https://via.placeholder.com/400x300?text=Taramundi'">
            <div class="slide-info">
                <span class="badge-novo">${d.label}</span>
                <h3>${itemData[0]}</h3>
                <p>${itemData[1]}</p>
                <span class="product-price" style="font-size: 1.8rem;">${itemData[2]}</span>
            </div>
        </div>
    `;
    // Gera os pontinhos
    dotsContainer.innerHTML += `<span class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></span>`;
});

// 3. Funções de movimento
function updateCarousel() {
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
    document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentIndex);
    });
}

function moveCarousel(direction) {
    currentIndex = (currentIndex + direction + destaques.length) % destaques.length;
    updateCarousel();
}

function goToSlide(index) {
    currentIndex = index;
    updateCarousel();
}

// Auto-play (Passa sozinho a cada 5 segundos)
setInterval(() => moveCarousel(1), 5000);
</script>
</body>
</html>
